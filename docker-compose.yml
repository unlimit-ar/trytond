services:
  trytond-v70:
    image: tryton/trytond:7.0
    container_name: trytond-v70
    build:
      dockerfile: Dockerfile
      context: .
    volumes:
      - ./modules/:/tmp/modules
      - ./trytond.conf:/etc/trytond.conf
      - ./sao:/var/wwww/sao
    ports:
      - "8000:8001"
    environment:
      - TRYTOND_CONFIG=/etc/trytond.conf
      - TRYTON_DATABASE=tryton
      - DB_HOST=postgres
      - MODULE_PREFIXES
    depends_on:
      - postgres
    command:
      trytond

  postgres:
    image: postgres:17
    container_name: postgres-v17
    environment:
      - POSTGRES_USER=tryton
      - POSTGRES_PASSWORD=tryton
      - POSTGRES_DB=tryton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryton"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: postgres_data_trytond_v70