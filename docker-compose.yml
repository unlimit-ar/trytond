services:
  trytond-v80:
    image: tryton/trytond:8.0
    container_name: trytond-v80
    build:
      dockerfile: Dockerfile
      context: .
    restart: always
    volumes:
      - ./modules/:/tmp/modules
      - ./modules_ar/:/tmp/modules_ar
      - ./trytond.conf:/etc/trytond.conf
    environment:
      - TRYTOND_CONFIG
    command:
      ["gunicorn", "-w", "3", "-b", "0.0.0.0:8000", "trytond-app"]

  trytond_worker-v80:
    image: tryton/trytond:8.0
    container_name: trytond_worker-v80
    restart: always
    volumes:
      - ./modules/:/tmp/modules
      - ./modules_ar/:/tmp/modules_ar
      - ./trytond.conf:/etc/trytond.conf
    environment:
      - TRYTOND_CONFIG
      - TRYTOND_DB
    command:
      ["trytond-worker", "-d", "${TRYTOND_DB}"]

  trytond-cron-v80:
    image: tryton/trytond:8.0
    container_name: trytond-cron-v80
    restart: always
    volumes:
      - ./modules/:/tmp/modules
      - ./modules_ar/:/tmp/modules_ar
      - ./trytond.conf:/etc/trytond.conf
    environment:
      - TRYTOND_CONFIG
      - TRYTOND_DB
    command:
      ["trytond-cron", "-d", "${TRYTOND_DB}"]

  nginx-sao-v80:
    image: nginx:stable
    container_name: nginx-sao-v80
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./sao:/var/www/sao
    ports:
      - "8080:80"
    depends_on:
      - trytond-v80
